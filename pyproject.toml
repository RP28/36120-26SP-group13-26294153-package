[project]
name = "mlweave"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "matplotlib==3.9.2",
    "numpy==2.0.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "scipy==1.14.0",
    "seaborn==0.13.2",
]

[project.scripts]
mlweave = "mlweave:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab==4.2.3",
    "pytest==8.2.2",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
