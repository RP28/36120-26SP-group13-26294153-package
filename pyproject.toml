[project]
name = "mlweave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
]

[project.scripts]
mlweave = "mlweave:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab==4.2.3",
    "pytest==8.2.2",
]
